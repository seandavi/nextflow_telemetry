<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 720" width="1420" height="720" role="img" aria-label="System architecture. nf-client daemons on the HPC login nodes claim work from the v2 Cloudflare control plane and submit SLURM wrapper jobs that run Nextflow; telemetry flows back to the Worker and outputs land in R2. The Postgres catalog service writes registrations through to v2. The dashboard reads both. nf-etl and nf-meta load outputs and metadata into the shared DuckLake.">
<title>System architecture. nf-client daemons on the HPC login nodes claim work from the v2 Cloudflare control plane and submit SLURM wrapper jobs that run Nextflow; telemetry flows back to the Worker and outputs land in R2. The Postgres catalog service writes registrations through to v2. The dashboard reads both. nf-etl and nf-meta load outputs and metadata into the shared DuckLake.</title>
