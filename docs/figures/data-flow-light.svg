<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 740" width="1580" height="740" role="img" aria-label="Data flow and publication routes. nf-etl ingests finished pipeline outputs from cmgd-raw; metadata sources are captured into the source catalog and loaded by nf-meta. Both write to the shared DuckLake, which feeds public releases (mirrored to Zenodo or Hugging Face) and scoped deliverables (which read outputs from cmgd-raw and metadata from the lake). Gene-family files are served straight from cmgd-raw.">
<title>Data flow and publication routes. nf-etl ingests finished pipeline outputs from cmgd-raw; metadata sources are captured into the source catalog and loaded by nf-meta. Both write to the shared DuckLake, which feeds public releases (mirrored to Zenodo or Hugging Face) and scoped deliverables (which read outputs from cmgd-raw and metadata from the lake). Gene-family files are served straight from cmgd-raw.</title>
