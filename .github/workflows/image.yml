name: image
# Build the API image and push it to Artifact Registry on every push to main.
# It does not deploy; see deploy/DEPLOY.md (`just deploy-api <sha>`).
# Repository variables (not secrets; no JSON key is used):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_IMAGE_PUSHER_SERVICE_ACCOUNT  service account with roles/artifactregistry.writer on the repository
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  IMAGE: us-east4-docker.pkg.dev/curatedmetagenomicdata/nextflow-telemetry/api
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUSHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: us-east4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
