# Read in place from the checkout ($NF_TEL_CONFIG); deployed by `just deploy-clients` (#254).
# ${NAME} is expanded from the daemon's environment
# (~/.nf_tel.env, ~/.nf_tel.secrets); an unset variable fails the load.
server_url: "https://nf-telemetry.seandavi.workers.dev/api"
weblog_url: "https://nf-telemetry.seandavi.workers.dev/telemetry"
token: "${NF_OPERATOR_TOKEN}"

profile: "alpine,r2"   # R2 output (ADR 0008); needs ~/.nf_tel.r2 and Nextflow >= 25.04
continuous: true

dispatch:
  batch_size: 25
  # cmgd_humann4a2 DBs (HUMAnN 4, vOct22, BAQLaVa) staged 2026-10-17 via
  # `--databases_only`. claimBatch sorts by workflow_id, so humann4a2 drains first.
  workflow_id: [cmgd_humann4a2, cmgd_mpa4.2]

submission:
  mode: slurm
  template_path: "${NF_TEL_REPO}/templates/submit_slurm.sh.j2"
  max_concurrent_runs: 10
  slurm_export_none: true    # Alpine leaks the login environment into jobs

  defaults:
    mem: "8G"
    cpus: 2
    time: "4-00:00:00"      # wrapper waits on every child incl. retries; cpu-long needs >24h
    partition: "acpu"        # amilan was retired; acpu caps at 1 day
    qos: "cpu-long"          # 7-day cap via PartitionTimeLimit; cpu-normal caps at 24h
    task_qos: "cpu-normal"   # per-task jobs (<= 24h); cpu-long rejects them and Alpine requires a qos
    account: "${NF_TEL_ACCOUNT}"
    log_dir: "${NF_TEL_LOGS}"
    publish_base: "s3://cmgd-raw"   # must match the r2 profile; results go to <base>/<workflow_id>/<version>/ (#220)
