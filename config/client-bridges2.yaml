# Read in place from the checkout ($NF_TEL_CONFIG); deployed by `just deploy-clients` (#254).
# ${NAME} is expanded from the daemon's environment
# (~/.nf_tel.env, ~/.nf_tel.secrets); an unset variable fails the load.
server_url: "https://nf-telemetry.seandavi.workers.dev/api"
weblog_url: "https://nf-telemetry.seandavi.workers.dev/telemetry"
token: "${NF_OPERATOR_TOKEN}"

profile: "bridges2,r2"   # R2 output (ADR 0008); needs ~/.nf_tel.r2 and Nextflow >= 25.04
continuous: true

dispatch:
  # ponytail: small batches x 3 runs keep peak Ocean disk ~1.5 TB under the 2 TB
  # quota (batch_size x max_concurrent_runs x 50 GB + ~85 GB store). Raise both
  # once the quota grows.
  batch_size: 10
  # Dedicated to the BAQLaVa registration for the RA/MS cohorts (#301, #303);
  # the HUMAnN 4 / vOct22 / BAQLaVa databases are staged only here.
  workflow_id: [cmgd_humann4a2]

submission:
  mode: slurm
  template_path: "${NF_TEL_REPO}/templates/submit_slurm.sh.j2"
  # Ocean disk is the limit, not SUs: the pipeline deletes nothing mid-run, so a
  # run holds about 50 GB per sample (fastq + kneaddata, measured on Anvil
  # 2026-10-13) until it ends. Peak disk ~ batch_size x max_concurrent_runs x 50 GB,
  # plus the ~85 GB store.
  max_concurrent_runs: 3
  slurm_export_none: false   # login env does not leak modules into jobs here (no modules loaded)

  defaults:
    # RM-shared rejects more than 2000 MB per core, for the wrapper and for every
    # task; the template raises each task's cores to fit its memory.
    max_mem_per_cpu_mb: 2000
    mem: "7900M"             # >4G for mksquashfs on a cold SIF cache (#208); 4 cores x 2000M
    cpus: 4
    time: "72:00:00"         # RM-shared max walltime is 3 days
    partition: "RM-shared"
    account: "${NF_TEL_ACCOUNT}"
    log_dir: "${NF_TEL_LOGS}"
    publish_base: "s3://cmgd-raw"   # must match the r2 profile; results go to <base>/<workflow_id>/<version>/ (#220)
