# Read in place from the checkout ($NF_TEL_CONFIG); deployed by `just deploy-clients` (#254).
# ${NAME} is expanded from the daemon's environment
# (~/.nf_tel.env, ~/.nf_tel.secrets); an unset variable fails the load.
server_url: "https://nf-telemetry.seandavi.workers.dev/api"
weblog_url: "https://nf-telemetry.seandavi.workers.dev/telemetry"
token: "${NF_OPERATOR_TOKEN}"

profile: "anvil,r2"    # R2 output (ADR 0008); needs ~/.nf_tel.r2 and Nextflow >= 25.04
continuous: true

dispatch:
  batch_size: 50             # smaller batches finish inside the wrapper walltime
  # No workflow_id: claim from every active registration. Pausing or retiring a
  # registration on the server is the gate (#249). Set a list here only for a
  # cluster that can't run everything.

submission:
  mode: slurm
  template_path: "${NF_TEL_REPO}/templates/submit_slurm.sh.j2"
  max_concurrent_runs: 5
  slurm_export_none: false   # Anvil's compute environment is clean

  defaults:
    mem: "8G"               # a cold SIF cache builds images in this job; 4G OOMs mksquashfs (#208)
    cpus: 2
    time: "96:00:00"
    partition: "shared"
    account: "${NF_TEL_ACCOUNT}"
    log_dir: "${NF_TEL_LOGS}"
    publish_base: "s3://cmgd-raw"   # must match the r2 profile; results go to <base>/<workflow_id>/<version>/ (#220)
