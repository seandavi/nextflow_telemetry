id: https://github.com/waldronlab/curatedMetagenomicDataCuration/cmd
name: cmd
title: curatedMetagenomicData sample metadata
description: Generated by scripts/cmd_schema.py from cMD_data_dictionary.csv; see pin.json. Do not edit.
prefixes:
  linkml: https://w3id.org/linkml/
  cmdschema: https://github.com/waldronlab/curatedMetagenomicDataCuration/cmd/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  FMA: http://purl.obolibrary.org/obo/FMA_
  HANCESTRO: http://purl.obolibrary.org/obo/HANCESTRO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  MRO: http://purl.obolibrary.org/obo/MRO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  SNOMED: http://snomed.info/id/
  UBERON: http://purl.obolibrary.org/obo/UBERON_
default_prefix: cmdschema
default_range: string
imports:
- linkml:types
classes:
  Sample:
    description: One curated cMD sample row.
    tree_root: true
    slots:
    - age
    - age_group
    - age_max
    - age_min
    - age_unit
    - age_years
    - ancestry
    - ancestry_details
    - antibiotics_current_use
    - antibiotics_exclusion_period
    - antibiotics_exclusion_period_unit
    - biomarker_name
    - biomarker_unit
    - biomarker_value
    - bmi
    - body_site
    - body_site_details
    - control
    - country
    - curator
    - days_from_first_collection
    - dietary_restriction
    - disease
    - disease_details
    - disease_response_orr
    - disease_response_os
    - disease_response_os_unit
    - disease_response_pfs
    - disease_response_pfs_month
    - disease_response_recist
    - dna_extraction_kit
    - ecog_performance_status
    - family
    - family_role
    - feces_phenotype
    - feces_phenotype_value
    - fmt_id
    - fmt_role
    - hla
    - host_species
    - lifestyle
    - location
    - ncbi_accession
    - neonatal_birth_weight
    - neonatal_delivery_procedure
    - neonatal_feeding_method
    - neonatal_gestational_age
    - neonatal_preterm_birth
    - obgyn_birth_control
    - obgyn_lactating
    - obgyn_menopause
    - obgyn_pregnancy
    - pmid
    - probing_pocket_depth
    - probing_pocket_depth_value
    - sample_id
    - sequencing_platform
    - sex
    - smoker
    - study_name
    - subcohort
    - subject_id
    - target_condition
    - treatment
    - tumor_size_measurement
    - tumor_size_residual_measurement
    - tumor_staging_ajcc
    - tumor_staging_tnm
    - uncurated_metadata
    - westernized
    - zigosity
slots:
  age:
    description: Participant age in the unit specified by `age_unit`.
    range: integer
    annotations:
      corpus_type: integer
      display_order: 1
      display_group: 03 Subject / Demographics
      allowed_pattern: '[0-9]+'
  age_group:
    description: 'Age group classification: Newborn (< 1 month/28 days), Infant (>= 1 month & < 2 yrs), Child (>= 2 yrs & < 11 yrs), Adolescent (>= 11 yrs & < 18 yrs), Adult (>= 18 yrs & < 65 yrs), Elderly (>= 65 yrs) Static ontology IDs: NCIT:C16731; NCIT:C27956; NCIT:C16423; NCIT:C27954; NCIT:C17600; NCIT:C16268. Type: static.'
    range: AgeGroupEnum
    annotations:
      corpus_type: static_enum
      display_order: 2
      display_group: 03 Subject / Demographics
  age_max:
    description: Maximum possible age. For samples only with 'age_group' information, this represents the definition of a given age group. For specific age information, 'age_min' and 'age_max' are identical.
    range: float
    annotations:
      corpus_type: regexp
      display_order: 11
      display_group: 03 Subject / Demographics
      allowed_pattern: '[0-9]+\.?[0-9]*'
  age_min:
    description: Minimum possible age. For samples only with 'age_group' information, this represents the definition of a given age group. For specific age information, 'age_min' and 'age_max' are identical.
    range: float
    annotations:
      corpus_type: regexp
      display_order: 10
      display_group: 03 Subject / Demographics
      allowed_pattern: '[0-9]+\.?[0-9]*'
  age_unit:
    description: 'Unit used to report `age`. Static ontology IDs: NCIT:C25301; NCIT:C29844; NCIT:C29846; NCIT:C29848. Type: static.'
    range: AgeUnitEnum
    annotations:
      corpus_type: static_enum
      display_order: 3
      display_group: 03 Subject / Demographics
  age_years:
    description: Age in years
    range: float
    annotations:
      corpus_type: regexp
      display_order: 12
      display_group: 03 Subject / Demographics
      allowed_pattern: '[0-9]+\.?[0-9]*'
  ancestry:
    description: 'Broad ancestry category (children of HANCESTRO:0004). Lookup seed ontology IDs: HANCESTRO:0004. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: AncestryEnum
    annotations:
      corpus_type: dynamic_enum
      display_order: 4
      display_group: 03 Subject / Demographics
  ancestry_details:
    description: 'More specific ancestry term(s) typically refer to descendants of the selected ancestry category. Lookup seed ontology IDs: HANCESTRO:0004. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: AncestryDetailsEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum
      display_order: 5
      display_group: 03 Subject / Demographics
      delimiter: ;
  antibiotics_current_use:
    description: Whether the participant is currently using antibiotics.
    range: AntibioticsCurrentUseEnum
    annotations:
      corpus_type: binary
      display_order: 13
      display_group: 04 Clinical / Intervention
  antibiotics_exclusion_period:
    description: Minimum washout period from antibiotic use required by study criteria.
    range: float
    annotations:
      corpus_type: regexp
      display_order: 11
      display_group: 01 Sampling / Study
      allowed_pattern: '[0-9]+\.?[0-9]*'
  antibiotics_exclusion_period_unit:
    description: 'Unit used for `antibiotics_exclusion_period`. Static ontology IDs: NCIT:C25301; NCIT:C29844; NCIT:C29846. Type: static.'
    range: AntibioticsExclusionPeriodUnitEnum
    annotations:
      corpus_type: static_enum
      display_order: 12
      display_group: 01 Sampling / Study
  biomarker_name:
    description: A measurable and quantifiable characteristic or substance that serves as an indicator of a biological state, condition, or process within an organism.
    range: string
    multivalued: true
    annotations:
      corpus_type: dynamic_enum
      display_order: 39
      display_group: 04 Clinical / Intervention
      delimiter: ;
  biomarker_unit:
    description: Unit for biomarker
    range: string
    multivalued: true
    annotations:
      corpus_type: any
      display_order: 40
      display_group: 04 Clinical / Intervention
      delimiter: ;
  biomarker_value:
    description: Value for biomarker
    range: float
    multivalued: true
    annotations:
      corpus_type: regexp
      display_order: 41
      display_group: 04 Clinical / Intervention
      delimiter: ;
      allowed_pattern: '[0-9]+\.?[0-9]*'
  bmi:
    description: Body mass index (BMI; EFO:0004340) calculated as weight (kg) divided by height squared (m²).
    range: float
    annotations:
      corpus_type: regexp
      display_order: 14
      display_group: 04 Clinical / Intervention
      allowed_pattern: '[0-9]+\.?[0-9]*'
  body_site:
    description: 'Anatomical body site from which the sample was collected. Static ontology IDs: UBERON:0001988; UBERON:0000167; UBERON:0001003; UBERON:0000996; UBERON:0001707; UBERON:0001913. Type: static.'
    range: BodySiteEnum
    required: true
    annotations:
      corpus_type: static_enum
      display_order: 4
      display_group: 01 Sampling / Study
  body_site_details:
    description: 'More specific anatomical subsite for sample collection than body_site. Lookup seed ontology IDs: UBERON:0001062. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: BodySiteDetailsEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum
      display_order: 5
      display_group: 01 Sampling / Study
      delimiter: ;
  control:
    description: 'Case-control role of the sample in the study. Static ontology IDs: NCIT:C142703; NCIT:C49152; NCIT:C69062. Type: static.'
    range: ControlEnum
    required: true
    annotations:
      corpus_type: static_enum
      display_order: 2
      display_group: 01 Sampling / Study
  country:
    description: 'Country where the participant resides and/or the sample was collected. Lookup seed ontology IDs: NCIT:C25464. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: CountryEnum
    annotations:
      corpus_type: dynamic_enum
      display_order: 3
      display_group: 01 Sampling / Study
  curator:
    description: Name(s) of curator(s) responsible for this entry.
    range: string
    multivalued: true
    annotations:
      corpus_type: any
      display_order: 4
      display_group: 00 Identifiers
      delimiter: ;
  days_from_first_collection:
    description: Days elapsed since the first collection time point in longitudinal studies.
    range: integer
    annotations:
      corpus_type: integer
      display_order: 6
      display_group: 01 Sampling / Study
      allowed_pattern: '[0-9]+'
  dietary_restriction:
    description: Dietary regime (partial match to SNOMED:182922004 or SNOMED:162536008)
    range: DietaryRestrictionEnum
    multivalued: true
    annotations:
      corpus_type: custom_enum
      display_order: 15
      display_group: 04 Clinical / Intervention
      delimiter: ;
  disease:
    description: 'Reported disease or condition term(s) for the participant; use Healthy when no target condition is detected. Lookup seed ontology IDs: NCIT:C7057; MONDO:0000001. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: DiseaseEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum|static_enum
      display_order: 16
      display_group: 04 Clinical / Intervention
      delimiter: ;
  disease_details:
    description: 'More specific disease or condition term(s) for the participant; use Healthy when appropriate. Lookup seed ontology IDs: NCIT:C7057; MONDO:0000001. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: DiseaseDetailsEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum|static_enum
      display_order: 17
      display_group: 04 Clinical / Intervention
      delimiter: ;
  disease_response_orr:
    description: Overall response rate (ORR; NCIT:C96613) indicator for treatment response.
    range: DiseaseResponseOrrEnum
    annotations:
      corpus_type: binary
      display_order: 18
      display_group: 04 Clinical / Intervention
  disease_response_os:
    description: Overall survival duration (time to death from any cause; NCIT:C125201).
    range: float
    annotations:
      corpus_type: numeric
      display_order: 42
      display_group: 04 Clinical / Intervention
      allowed_pattern: ^[1-9]\d*(\.\d+)?$
  disease_response_os_unit:
    description: 'Unit used to report `disease_response_os`. Static ontology IDs: NCIT:C25301; NCIT:C29844; NCIT:C29846; NCIT:C29848. Type: static.'
    range: DiseaseResponseOsUnitEnum
    annotations:
      corpus_type: static_enum
      display_order: 43
      display_group: 04 Clinical / Intervention
  disease_response_pfs:
    description: 'Progression Free Survival (PFS, EFO:0004920): Progression free survival is a measurement from a defined time point e.g. diagnosis and indicates that the disease did not progress i.e. tumours did not increase in size and new incidences did not occur. PFS is usually used in analyzing results of treatment for advanced disease.'
    range: DiseaseResponsePfsEnum
    annotations:
      corpus_type: binary
      display_order: 19
      display_group: 04 Clinical / Intervention
  disease_response_pfs_month:
    description: Progression-free survival follow-up time in months.
    range: integer
    annotations:
      corpus_type: integer
      display_order: 20
      display_group: 04 Clinical / Intervention
      allowed_pattern: '[0-9]+'
  disease_response_recist:
    description: 'Response Evaluation Criteria in Solid Tumors (RECIST, DICOM:112022): Standard parameters to be used when documenting response of solid tumors to treatment; a set of published rules that define when cancer patients improve (`respond`), stay the same (`stable`), or worsen (`progression`) during treatments. (from www.recist.com) Static ontology IDs: NCIT:C159715; NCIT:C159547; NCIT:C159716; NCIT:C159546. Type: static.'
    range: DiseaseResponseRecistEnum
    annotations:
      corpus_type: static_enum
      display_order: 21
      display_group: 04 Clinical / Intervention
  dna_extraction_kit:
    description: Name of the DNA extraction kit or protocol used.
    range: DnaExtractionKitEnum
    annotations:
      corpus_type: custom_enum
      display_order: 1
      display_group: 02 Sequencing / QC
  ecog_performance_status:
    description: 'A performance status scale designed to assess disease progression and its affect on the daily living abilities of the patient. (NCIT:C105721) Static ontology IDs: NCIT:C105722; NCIT:C105723; NCIT:C105724; NCIT:C105725; NCIT:C105726; NCIT:C105727; NCIT:C105728. Type: static.'
    range: EcogPerformanceStatusEnum
    annotations:
      corpus_type: static_enum
      display_order: 44
      display_group: 04 Clinical / Intervention
  family:
    description: Family identifier when multiple related participants are included.
    range: string
    pattern: .+
    annotations:
      corpus_type: any
      display_order: 6
      display_group: 03 Subject / Demographics
  family_role:
    description: Participant role within the family (for family-based sampling).
    range: FamilyRoleEnum
    annotations:
      corpus_type: custom_enum
      display_order: 7
      display_group: 03 Subject / Demographics
  feces_phenotype:
    description: 'Stool-related phenotype or clinical measurement type. Static ontology IDs: SNOMED:443172007; NCIT:C82005; NCIT:C191036. Type: static.'
    range: FecesPhenotypeEnum
    multivalued: true
    annotations:
      corpus_type: static_enum
      display_order: 22
      display_group: 04 Clinical / Intervention
      delimiter: <;>
  feces_phenotype_value:
    description: Value(s) corresponding to `feces_phenotype` measurements.
    range: string
    multivalued: true
    pattern: ^\d+(\.\d+)?$
    annotations:
      corpus_type: character
      display_order: 45
      display_group: 04 Clinical / Intervention
      delimiter: <;>
  fmt_id:
    description: Study-specific identifier assigned to FMT participants.
    range: string
    multivalued: true
    pattern: .+
    annotations:
      corpus_type: any
      display_order: 23
      display_group: 04 Clinical / Intervention
      delimiter: ;
  fmt_role:
    description: Role in fecal microbiota transplantation (donor or recipient before/after procedure).
    range: FmtRoleEnum
    annotations:
      corpus_type: custom_enum
      display_order: 24
      display_group: 04 Clinical / Intervention
  hla:
    description: 'Human leukocyte antigen (HLA) typing information. Lookup seed ontology IDs: MRO:0001676. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: HlaEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum
      display_order: 25
      display_group: 04 Clinical / Intervention
      delimiter: ;
  host_species:
    description: Host species of the participant.
    range: HostSpeciesEnum
    required: true
    annotations:
      corpus_type: dynamic_enum
      display_order: 14
      display_group: 01 Sampling / Study
  lifestyle:
    description: Lifestyle category (primarily used for traditional or non-westernized populations).
    range: LifestyleEnum
    annotations:
      corpus_type: custom_enum
      display_order: 7
      display_group: 01 Sampling / Study
  location:
    description: Free-text additional location detail (for example city or region).
    range: string
    pattern: .+
    annotations:
      corpus_type: any
      display_order: 8
      display_group: 01 Sampling / Study
  ncbi_accession:
    description: INSDC sequence accession(s) associated with the sample or run, from NCBI SRA (SRR/SRS), EBI ENA (ERR/ERS) or DDBJ (DRR/DRS).
    range: string
    multivalued: true
    pattern: '[DES]R[SR][0-9]+'
    annotations:
      corpus_type: regexp
      display_order: 4
      display_group: 02 Sequencing / QC
      delimiter: ;
  neonatal_birth_weight:
    description: Birth weight (EFO:0004344) recorded in grams.
    range: float
    annotations:
      corpus_type: numeric
      display_order: 26
      display_group: 04 Clinical / Intervention
      allowed_pattern: ^[1-9]\d*(\.\d+)?$
  neonatal_delivery_procedure:
    description: 'Delivery method at birth (NCIT:C81179). Static ontology IDs: NCIT:C114141; NCIT:C92772; NCIT:C46088; NCIT:C81303. Type: static.'
    range: NeonatalDeliveryProcedureEnum
    annotations:
      corpus_type: static_enum
      display_order: 27
      display_group: 04 Clinical / Intervention
  neonatal_feeding_method:
    description: Infant feeding method(s) during early life.
    range: NeonatalFeedingMethodEnum
    multivalued: true
    annotations:
      corpus_type: custom_enum
      display_order: 28
      display_group: 04 Clinical / Intervention
      delimiter: ;
  neonatal_gestational_age:
    description: Gestational age at birth (EFO:0005112) in weeks.
    range: float
    annotations:
      corpus_type: numeric
      display_order: 29
      display_group: 04 Clinical / Intervention
      allowed_pattern: ^[1-9]\d*(\.\d+)?$
  neonatal_preterm_birth:
    description: 'Birth when a fetus is less than 37 weeks and 0 days gestational age (NCIT:C92861). Static ontology IDs: NCIT:C92861; NCIT:C114093. Type: static.'
    range: NeonatalPretermBirthEnum
    annotations:
      corpus_type: static_enum
      display_order: 30
      display_group: 04 Clinical / Intervention
  obgyn_birth_control:
    description: Whether oral contraceptive birth control is currently used.
    range: ObgynBirthControlEnum
    annotations:
      corpus_type: binary
      display_order: 31
      display_group: 04 Clinical / Intervention
  obgyn_lactating:
    description: An indication that the subject is currently producing milk. (NCIT:C82463)
    range: ObgynLactatingEnum
    annotations:
      corpus_type: binary
      display_order: 32
      display_group: 04 Clinical / Intervention
  obgyn_menopause:
    description: 'Menopausal status of the participant. Lookup seed ontology IDs: NCIT:C106541. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: ObgynMenopauseEnum
    annotations:
      corpus_type: dynamic_enum
      display_order: 33
      display_group: 04 Clinical / Intervention
  obgyn_pregnancy:
    description: 'Current pregnancy status of the participant. Static ontology IDs: NCIT:C124295; NCIT:C82475. Type: static.'
    range: ObgynPregnancyEnum
    annotations:
      corpus_type: static_enum
      display_order: 34
      display_group: 04 Clinical / Intervention
  pmid:
    description: PubMed identifier of the primary publication for the study.
    range: integer
    annotations:
      corpus_type: integer
      display_order: 5
      display_group: 00 Identifiers
      allowed_pattern: '[0-9]{8}'
  probing_pocket_depth:
    description: 'Tooth surface/region where periodontal pocket depth was measured. Static ontology IDs: FMA:64849; FMA:55649; FMA:55647; FMA:55650. Type: static.'
    range: ProbingPocketDepthEnum
    multivalued: true
    annotations:
      corpus_type: static_enum
      display_order: 9
      display_group: 01 Sampling / Study
      delimiter: <;>
  probing_pocket_depth_value:
    description: Numeric probing depth measurement corresponding to `probing_pocket_depth`.
    range: string
    multivalued: true
    pattern: ^\d+(\.\d+)?$
    annotations:
      corpus_type: character
      display_order: 13
      display_group: 01 Sampling / Study
      delimiter: <;>
  sample_id:
    description: Unique identifier for a biospecimen/sample.
    range: string
    identifier: true
    required: true
    pattern: '[0-9a-zA-Z]\S+'
    annotations:
      corpus_type: regexp
      display_order: 3
      display_group: 00 Identifiers
  sequencing_platform:
    description: Sequencing platform/instrument used to generate the data.
    range: SequencingPlatformEnum
    required: true
    annotations:
      corpus_type: custom_enum
      display_order: 7
      display_group: 02 Sequencing / QC
  sex:
    description: 'Biological sex of the subject Static ontology IDs: NCIT:C16576; NCIT:C20197. Type: static.'
    range: SexEnum
    annotations:
      corpus_type: static_enum
      display_order: 8
      display_group: 03 Subject / Demographics
  smoker:
    description: 'Tobacco smoking status/history; use `Non-smoker (finding)` only when past smoking history is unavailable. Static ontology IDs: SNOMED:77176002; SNOMED:8392000; SNOMED:8517006; SNOMED:266919005. Type: static.'
    range: SmokerEnum
    multivalued: true
    annotations:
      corpus_type: static_enum
      display_order: 35
      display_group: 04 Clinical / Intervention
      delimiter: ;
  study_name:
    description: Canonical study identifier (for example EinsteinA_YYYY).
    range: string
    required: true
    pattern: '[a-zA-Z-]+_[0-9]{4}|[a-zA-Z-]+_[0-9]{4}[a-zA-Z-]+|[a-zA-Z-]+_[0-9]{4}_[a-zA-Z-]+|[a-zA-Z-]+_[0-9]{4}_[a-zA-Z0-9]+'
    annotations:
      corpus_type: regexp
      display_order: 1
      display_group: 00 Identifiers
  subcohort:
    description: Identifier for a subset of the study cohort.
    range: string
    pattern: '[0-9a-zA-Z]\S+'
    annotations:
      corpus_type: regexp
      display_order: 6
      display_group: 00 Identifiers
  subject_id:
    description: Unique identifier for a participant within a study. Values may be non-unique e.g. when there are repeated measures for a participant.
    range: string
    required: true
    pattern: '[0-9a-zA-Z]\S+'
    annotations:
      corpus_type: regexp
      display_order: 2
      display_group: 00 Identifiers
  target_condition:
    description: 'Primary phenotype(s) or condition(s) investigated in the study. Lookup seed ontology IDs: NCIT:C7057; MONDO:0000001. Type: looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: TargetConditionEnum
    required: true
    multivalued: true
    annotations:
      corpus_type: dynamic_enum|static_enum
      display_order: 1
      display_group: 01 Sampling / Study
      delimiter: ;
  treatment:
    description: 'Treatment(s) or medication(s) administered to the participant. Static ontology IDs: NCIT:C41132. Lookup seed ontology IDs: NCIT:C1908. Type: static + looked_up. Looked up: Yes. Includes child terms: Yes. Existing-dataset-only values now: Conditional (Yes only when lookup falls back to curated existing dataset values)'
    range: TreatmentEnum
    multivalued: true
    annotations:
      corpus_type: dynamic_enum|static_enum
      display_order: 36
      display_group: 04 Clinical / Intervention
      delimiter: ;
  tumor_size_measurement:
    description: Tumor size measurement from clinical assessment or resected specimen (NCIT:C106303).
    range: float
    annotations:
      corpus_type: numeric
      display_order: 46
      display_group: 04 Clinical / Intervention
      allowed_pattern: ^[1-9]\d*(\.\d+)?$
  tumor_size_residual_measurement:
    description: Residual tumor size measurement after treatment/procedure (NCIT:C198194).
    range: string
    pattern: ^[1-9]\d*(\.\d+)?$
    annotations:
      corpus_type: numeric
      display_order: 47
      display_group: 04 Clinical / Intervention
  tumor_staging_ajcc:
    description: American Joint Committee on Cancer (tumor staging) (SNOMED:258236004). A system to describe the amount and spread of cancer in a patient's body
    range: TumorStagingAjccEnum
    annotations:
      corpus_type: static_enum
      display_order: 37
      display_group: 04 Clinical / Intervention
  tumor_staging_tnm:
    description: Tumor-node-metastasis (TNM) tumor staging system (tumor staging) (SNOMED:254293002).A system to describe the amount and spread of cancer in a patient's body
    range: string
    pattern: T[X1-4]N[X0-3]M[X0-1]|pTis|Tis
    annotations:
      corpus_type: regexp
      display_order: 38
      display_group: 04 Clinical / Intervention
  uncurated_metadata:
    description: Additional free-text metadata not represented by existing fields.
    range: string
    multivalued: true
    pattern: .+
